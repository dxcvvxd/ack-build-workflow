name: Build Android Common Kernel

on:
  workflow_dispatch:
    inputs:
      ack_branch:
        description: 'Android-common-kernel branch'
        required: true
        default: 'common-android13-5.15'
        type: string

      custom_kernel_repo:
        description: 'Custom kernel repository'
        required: true
        default: 'https://github.com/dxcvvxd/device_xiaomi_gemstones-kernel'
        type: string

      custom_kernel_repo_branch:
        description: 'Custom kernel repository branch'
        required: true
        default: 'main'
        type: string

      use_latest_clang:
        description: 'Use pinned clang prebuilts rev (contains clang-r547379)'
        required: true
        default: true
        type: boolean

      anykernel_url_plus_branch:
        description: 'AnyKernel3 URL + optional branch'
        required: true
        default: 'https://github.com/dxcvvxd/AnyKernel3'
        type: string

      extra_args:
        description: 'Extra arguments passed to build.sh'
        required: false
        type: string

jobs:
  build:
    timeout-minutes: 720
    runs-on: ubuntu-24.04

    env:
      CONFIG: build.config.gki.aarch64.chickernel.ksun.susfs
      IMAGE_TYPE: Image

      ACK_BRANCH: ${{ github.event.inputs.ack_branch }}
      COMMON_REPO: ${{ github.event.inputs.custom_kernel_repo }}
      COMMON_REPO_BRANCH: ${{ github.event.inputs.custom_kernel_repo_branch }}
      AK3_GIT_URL_PLUS_BRANCH: ${{ github.event.inputs.anykernel_url_plus_branch }}

      AK3_DIR: ${{ github.workspace }}/kernel-build/anykernel3
      FINAL_DIR: ${{ github.workspace }}/kernel-build/final_images

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -e

          AK3_GIT_URL=$(echo "${AK3_GIT_URL_PLUS_BRANCH}" | awk '{print $1}')
          AK3_GIT_BRANCH=$(echo "${AK3_GIT_URL_PLUS_BRANCH}" | awk '{print $2}')

          echo "AK3_GIT_URL=${AK3_GIT_URL}" >> ${GITHUB_ENV}
          echo "AK3_GIT_BRANCH=${AK3_GIT_BRANCH}" >> ${GITHUB_ENV}

          validate_url() {
            if [[ ! "$1" =~ ^https://.+/.+/.+$ ]]; then
              echo "::error::Invalid URL: $1"
              exit 1
            fi
          }

          validate_single_word() {
            if [[ "$1" =~ [[:space:]] ]]; then
              echo "::error::Invalid $2: $1"
              exit 1
            fi
          }

          validate_url "${COMMON_REPO}"
          validate_url "${AK3_GIT_URL}"

          validate_single_word "${ACK_BRANCH}" "ACK branch"
          validate_single_word "${COMMON_REPO_BRANCH}" "Kernel repo branch"

          if [ -n "${AK3_GIT_BRANCH}" ]; then
            validate_single_word "${AK3_GIT_BRANCH}" "AK3 branch"
          fi

      - name: Setup workspace and manifest
        shell: bash
        env:
          USE_LATEST_CLANG: ${{ github.event.inputs.use_latest_clang }}
          CUSTOM_MANIFEST: .repo/local_manifests/custom.xml
        run: |
          set -e

          REPO_SOURCE=$(echo ${COMMON_REPO} | cut -d'/' -f3)
          REPO_OWNER=$(echo ${COMMON_REPO} | cut -d'/' -f4)
          REPO_NAME=$(echo ${COMMON_REPO} | cut -d'/' -f5)

          mkdir kernel-build
          cd kernel-build

          mkdir -p .repo/local_manifests

          cat > ${CUSTOM_MANIFEST} << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote
              name="common-repo"
              fetch="https://${REPO_SOURCE}/${REPO_OWNER}" />

            <remove-project name="kernel/common" />

            <project
              path="common"
              name="${REPO_NAME}"
              remote="common-repo"
              revision="${COMMON_REPO_BRANCH}"
              clone-depth="1">

              <linkfile src="." dest=".source_date_epoch_dir" />
            </project>
          EOF

          if [ "${USE_LATEST_CLANG}" = true ]; then
            cat >> ${CUSTOM_MANIFEST} << EOF
              <remove-project name="platform/prebuilts/clang/host/linux-x86" />
          EOF
          fi

          echo "</manifest>" >> ${CUSTOM_MANIFEST}

      - name: Download utilities
        working-directory: kernel-build
        shell: bash
        run: |
          set -e

          if [ -z "${AK3_GIT_BRANCH}" ]; then
            git clone --depth=1 "${AK3_GIT_URL}" "${AK3_DIR}"
          else
            git clone --depth=1 \
              -b "${AK3_GIT_BRANCH}" \
              "${AK3_GIT_URL}" \
              "${AK3_DIR}"
          fi

          mkdir -p ~/.bin

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            > ~/.bin/repo

          chmod a+rx ~/.bin/repo

          echo "${HOME}/.bin" >> ${GITHUB_PATH}

      - name: Cleanup runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Cache prebuilts (clang)
        uses: actions/cache@v4
        with:
          path: kernel-build/prebuilts/clang/host/linux-x86
          key: prebuilts-${{ github.ref_name }}-v4

      - name: Fetch pinned clang prebuilts (repo-independent)
        working-directory: kernel-build
        shell: bash
        run: |
          set -e

          CLANG_REPO=prebuilts/clang/host/linux-x86
          CLANG_COMMIT=70a12c4fe88940ab2b0e6d763492dffa2f07e15a
          CLANG_DIR=clang-r547379

          if [ -x "${CLANG_REPO}/${CLANG_DIR}/bin/clang" ]; then
            echo "clang OK at ${CLANG_REPO}/${CLANG_DIR}/bin/clang"
            exit 0
          fi

          echo "clang missing; fetching pinned ${CLANG_COMMIT}..."
          rm -rf "${CLANG_REPO}"
          mkdir -p "${CLANG_REPO}"
          git init -q "${CLANG_REPO}"
          git -C "${CLANG_REPO}" remote add origin \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git -C "${CLANG_REPO}" fetch --depth=1 --filter=blob:none origin "${CLANG_COMMIT}"
          git -C "${CLANG_REPO}" sparse-checkout init --no-cone
          git -C "${CLANG_REPO}" sparse-checkout set "${CLANG_DIR}"
          git -C "${CLANG_REPO}" checkout -q "${CLANG_COMMIT}"

          if [ ! -x "${CLANG_REPO}/${CLANG_DIR}/bin/clang" ]; then
            echo "::error::clang ${CLANG_DIR} not found at ${CLANG_COMMIT}"
            ls -1 "${CLANG_REPO}" 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "clang fetched at ${CLANG_REPO}/${CLANG_DIR}/bin/clang"

      - name: Init and sync repo
        working-directory: kernel-build
        shell: bash
        run: |
          set -e

          max_attempts=3

          # googlesource frequently throws transient 502/503; retry
          repo init \
            --no-tags \
            --depth=1 \
            --dissociate \
            -u https://android.googlesource.com/kernel/manifest \
            -b ${ACK_BRANCH}

          for attempt in $(seq 1 ${max_attempts}); do
            echo "repo sync attempt ${attempt}/${max_attempts}"
            repo sync \
              --no-tags \
              --clone-bundle \
              --current-branch \
              --optimized-fetch \
              --force-sync \
              --recurse-submodules \
              -j$(nproc --all) && break
            [ ${attempt} -eq ${max_attempts} ] && exit 1
            sleep 30
          done

          # repo's --recurse-submodules is flaky (empty dirs on partial fetch);
          # force a real submodule checkout before any step touches them
          for attempt in $(seq 1 ${max_attempts}); do
            echo "submodule update attempt ${attempt}/${max_attempts}"
            git -C common submodule update --init --recursive \
              && break
            [ ${attempt} -eq ${max_attempts} ] && exit 1
            sleep 10
          done

          git -C common submodule status

      - name: Fix KernelSU versioning
        working-directory: kernel-build
        shell: bash
        run: |
          set -e
          cd common/KernelSU-Next

          if git rev-parse --is-shallow-repository | grep -q true; then
            git fetch --unshallow
          fi
          git fetch --tags

      # - name: Debug build.sh
      #   working-directory: kernel-build
      #   run: |
      #     pwd
      
      #     ls -l build
      #     ls -l build/kernel
      #     ls -l build/build.sh
      
      #     readlink -f build/build.sh || true
      
      #     file build/build.sh || true
      #     file build/kernel/build.sh || true
      
      #     head -n 5 build/kernel/build.sh || true

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: kernel-build/out
          key: build-${{ github.sha }}
          restore-keys: |
            build-${{ github.ref_name }}-
            build-

      - name: Build kernels
        working-directory: kernel-build
        shell: bash
        env:
          EXTRA_ARGS: ${{ github.event.inputs.extra_args }}
          OUT_DIR: ${{ github.workspace }}/kernel-build/out

        run: |
          set -e

          mkdir -p "${FINAL_DIR}"

          echo "Building ${CONFIG}"
          BUILD_CONFIG="common/${CONFIG}" \
          build/build.sh ${EXTRA_ARGS}

          if [ ! -f "${OUT_DIR}/dist/${IMAGE_TYPE}" ]; then
            echo "::error::Missing kernel image for ${CONFIG}"
            exit 1
          fi

          cp "${OUT_DIR}/dist/${IMAGE_TYPE}" "${FINAL_DIR}/${IMAGE_TYPE}"

      - name: Package with AnyKernel3
        working-directory: kernel-build
        shell: bash
        run: |
          set -e

          cp -r "${AK3_DIR}" ak3-work
          cp "${FINAL_DIR}/${IMAGE_TYPE}" "ak3-work/${IMAGE_TYPE}"

          cd ak3-work
          zip -r9 \
            "${FINAL_DIR}/${CONFIG}.zip" \
            . \
            -x ".git/*" \
            "README.md" \
            "*placeholder*"

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages
          path: kernel-build/final_images/*.zip
          if-no-files-found: error
          retention-days: 30
